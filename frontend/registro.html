<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | NOVA</title><link rel="stylesheet" href="./css/styles.css"><script src="./js/main.js" defer></script></head><body><header class="navbar"><a class="brand" href="./index.html">NOVA</a><nav class="nav-links"><a href="./login.html">Iniciar sesión</a></nav></header><main class="form-page"><form class="form-card" data-form="register"><h1>Crear cuenta</h1><p>Elige cómo quieres usar NOVA.</p><label class="field">Nombre<input name="name" autocomplete="name" required maxlength="100"></label><label class="field">Correo electrónico<input name="email" type="email" autocomplete="email" required></label><label class="field">Tipo de cuenta<select name="type" required><option value="">Selecciona una opción</option><option value="candidato">Candidato</option><option value="empresa">Empresa</option></select></label><label class="field">Contraseña<input name="password" type="password" autocomplete="new-password" required minlength="6"></label><p class="notice" role="status" aria-live="polite"></p><button class="button" type="submit">Crear cuenta</button><p>¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a></p></form></main></body></html>
